name: Java CI with JUnit (No Maven)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: List JARs in lib/
      run: ls -la lib/

    - name: Compile Main Java Classes
      run: |
        mkdir -p bin
        javac -cp "lib/*" -d bin src/com/garv/cloudsim/DeadlineAwareSimulation.java

    - name: Compile Test Classes
      run: |
        mkdir -p test-bin
        javac -cp "lib/*:bin" -d test-bin src/test/java/com/garv/cloudsim/DeadlineTest.java

    - name: Run JUnit Tests
      run: |
        java -jar lib/junit-platform-console-standalone-1.10.0.jar \
          --class-path bin:test-bin \
          --scan-class-path
